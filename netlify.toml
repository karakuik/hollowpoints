[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/upload/matches"
  to = "/.netlify/functions/first-blood-upload"
  status = 200

[[redirects]]
  from = "/api/players/:gameName"
  to = "/.netlify/functions/first-blood-player?gameName=:gameName"
  status = 200

[[redirects]]
  from = "/jewelcrafting"
  to = "/wow/midnight/jewelcrafting"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
