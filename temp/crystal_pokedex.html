<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Pokédex — GSC Viability Guide</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{--bg:#0d0f14;--surface:#161920;--border:#2a2d38;--text:#e8eaf0;--muted:#6b7080;--green:#39d353;--yellow:#f0b429;--red:#e05252;--blue:#60a0f0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;z-index:0;}
  .wrap{position:relative;z-index:1;max-width:1140px;margin:0 auto;padding:2rem 1.5rem 4rem;}
  header{margin-bottom:1.75rem;}
  .logo{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--green);letter-spacing:2px;line-height:1.8;margin-bottom:.4rem;text-shadow:0 0 20px rgba(57,211,83,.4);}
  .subtitle{color:var(--muted);font-size:11px;letter-spacing:1px;}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem;align-items:center;}
  input,select{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:7px 10px;border-radius:4px;outline:none;transition:border-color .15s;}
  input:focus,select:focus{border-color:var(--green);}
  input[type=text]{min-width:180px;flex:1;}
  select{cursor:pointer;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:.9rem;font-size:11px;color:var(--muted);align-items:center;}
  .legend-item{display:flex;align-items:center;gap:5px;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .summary{font-size:11px;color:var(--muted);margin-bottom:.6rem;letter-spacing:.5px;}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:6px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  thead{background:var(--surface);position:sticky;top:0;z-index:2;}
  th{padding:9px 8px;text-align:left;font-size:9px;font-family:'Press Start 2P',monospace;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap;border-bottom:1px solid var(--border);transition:color .1s;}
  th:hover{color:var(--text);}th.sorted{color:var(--green);}
  td{padding:7px 8px;border-bottom:1px solid rgba(42,45,56,.5);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.viable{background:rgba(57,211,83,.03);}tr.decent{background:rgba(240,180,41,.03);}
  tr.rowskip{background:rgba(224,82,82,.03);}tr.misc{background:rgba(107,112,128,.03);}
  tr:hover td{background:rgba(255,255,255,.04)!important;}
  .vdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .vg{background:var(--green);box-shadow:0 0 5px rgba(57,211,83,.5);}
  .vlg{background:#90d060;}.vy{background:var(--yellow);box-shadow:0 0 5px rgba(240,180,41,.4);}
  .vr{background:var(--red);}.vgr{background:var(--muted);}.vb{background:var(--blue);}
  .name-cell{display:flex;align-items:center;gap:5px;white-space:nowrap;font-weight:500;}
  .type-badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:10px;margin-right:2px;white-space:nowrap;}
  .tier-badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;font-family:'Press Start 2P',monospace;white-space:nowrap;}
  .t-uber{background:rgba(112,56,248,.2);color:#a87fff;border:1px solid rgba(112,56,248,.4);}
  .t-ou{background:rgba(192,48,40,.2);color:#ff8080;border:1px solid rgba(192,48,40,.4);}
  .t-uubl{background:rgba(230,88,46,.2);color:#ffaa70;border:1px solid rgba(230,88,46,.3);}
  .t-uu{background:rgba(224,160,32,.2);color:#f0c060;border:1px solid rgba(224,160,32,.3);}
  .t-nubl{background:rgba(90,170,54,.15);color:#90d060;border:1px solid rgba(90,170,54,.3);}
  .t-nu{background:rgba(29,158,117,.15);color:#50c8a0;border:1px solid rgba(29,158,117,.3);}
  .t-publ{background:rgba(59,141,219,.15);color:#70b0f0;border:1px solid rgba(59,141,219,.3);}
  .t-pu{background:rgba(126,206,206,.15);color:#90d0d0;border:1px solid rgba(126,206,206,.3);}
  .t-zubl{background:rgba(160,64,160,.15);color:#c080c0;border:1px solid rgba(160,64,160,.3);}
  .t-zu{background:rgba(120,120,128,.15);color:#a0a0b0;border:1px solid rgba(120,120,128,.3);}
  .t-nfe{background:rgba(184,184,208,.1);color:#b0b0c8;border:1px solid rgba(184,184,208,.2);}
  .t-lc{background:rgba(107,112,128,.1);color:#909098;border:1px solid rgba(107,112,128,.2);}
  .evo-cell{font-size:11px;line-height:1.6;min-width:170px;max-width:260px;}
  .evo-line{display:flex;align-items:baseline;gap:4px;flex-wrap:nowrap;}
  .evo-arrow{color:var(--muted);font-size:10px;flex-shrink:0;}
  .evo-name{color:var(--text);white-space:nowrap;}.evo-how{color:var(--muted);font-size:10px;white-space:nowrap;}
  .evo-badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px;white-space:nowrap;margin-left:3px;font-family:'Press Start 2P',monospace;}
  .eb-great{background:rgba(57,211,83,.15);color:var(--green);border:1px solid rgba(57,211,83,.3);}
  .eb-good{background:rgba(240,180,41,.15);color:var(--yellow);border:1px solid rgba(240,180,41,.3);}
  .eb-meh{background:rgba(224,82,82,.15);color:var(--red);border:1px solid rgba(224,82,82,.3);}
  .eb-trade{background:rgba(96,160,240,.15);color:var(--blue);border:1px solid rgba(96,160,240,.3);}
  .stat-bar{display:flex;align-items:center;gap:5px;min-width:68px;}
  .bar-bg{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px;}
  .bar-val{font-size:11px;color:var(--muted);min-width:26px;text-align:right;}
  .verdict{font-size:9px;font-family:'Press Start 2P',monospace;white-space:nowrap;}
  .vc{color:var(--green);}.vs{color:#90d060;}.vm{color:var(--yellow);}
  .vw{color:var(--red);}.vsk{color:var(--muted);}.ve{color:var(--blue);}
  .no-results{text-align:center;padding:3rem;color:var(--muted);font-size:11px;font-family:'Press Start 2P',monospace;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>

<div class="wrap">
  <header>

      <option value="mid">~ Mid (NU)</option>

    <select id="typeFilter" onchange="render()"><option value="">All types</option></select>

      <option value="name">Sort: Name</option>

      <option value="atk">Sort: Atk</option>

    <div class="legend-item"><span class="dot" style="background:var(--blue)"></span>TRADE badge = needs link cable</div>
  </div>
  <div class="summary" id="summary"></div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>·</th>
        <th onclick="toggleSort('name')" id="th-name">NAME</th>
        <th onclick="toggleSort('type')" id="th-type">TYPE</th>

        <th onclick="toggleSort('hp')" id="th-hp">HP</th>
        <th onclick="toggleSort('atk')" id="th-atk">ATK</th>
        <th onclick="toggleSort('def')" id="th-def">DEF</th>
        <th onclick="toggleSort('spa')" id="th-spa">SPA</th>
        <th onclick="toggleSort('spd')" id="th-spd">SPD</th>
        <th onclick="toggleSort('spe')" id="th-spe">SPE</th>
        <th onclick="toggleSort('bst')" id="th-bst">BST</th>
        <th>VERDICT</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

const TIER_ORDER=['Uber','OU','UUBL','UU','NUBL','NU','PUBL','PU','ZUBL','ZU','NFE','LC'];
const TYPE_COLORS={Normal:'#9e9e9e',Fire:'#e6582e',Water:'#3b8ddb',Grass:'#5aaa36',Electric:'#c8a800',Ice:'#5ab8b8',Fighting:'#c03028',Poison:'#a040a0',Ground:'#b89040',Flying:'#7060d0',Psychic:'#d84878',Bug:'#789010',Rock:'#a08828',Ghost:'#604878',Dragon:'#6030e8',Dark:'#503828',Steel:'#8888a8'};

function getViability(tier){
  if(['Uber','OU'].includes(tier)) return 'carry';
  if(['UUBL','UU'].includes(tier)) return 'solid';
  if(['NUBL','NU'].includes(tier)) return 'mid';
  if(['PUBL','PU','ZUBL','ZU'].includes(tier)) return 'weak';
  return 'skip';
}

function ftClass(ft,trade){
  if(trade) return 'eb-trade';
  if(!ft) return 'eb-meh';
  if(['OU','Uber'].includes(ft)) return 'eb-great';
  if(['UUBL','UU','NUBL'].includes(ft)) return 'eb-good';
  return 'eb-meh';
}
function ftLabel(ft,trade){
  if(trade) return 'TRADE';
  if(!ft) return 'MEH';
  if(['OU','Uber'].includes(ft)) return 'GREAT';
  if(['UUBL','UU','NUBL'].includes(ft)) return 'GOOD';
  return 'MEH';
}

const VLABEL={carry:'★ CARRY',solid:'▲ SOLID',mid:'~ MID',weak:'▼ WEAK',skip:'✕ SKIP'};
const DCLS={carry:'vg',solid:'vlg',mid:'vy',weak:'vr',skip:'vgr'};
const RCLS={carry:'viable',solid:'viable',mid:'decent',weak:'rowskip',skip:'misc'};
const VCSS={carry:'vc',solid:'vs',mid:'vm',weak:'vw',skip:'vsk'};

const data=RAW.trim().split('\n').map(line=>{
  const[name,type,tier,hp,atk,def,spa,spd,spe]=line.split(',');
  const bst=+hp+ +atk+ +def+ +spa+ +spd+ +spe;
  return{name,type,tier,hp:+hp,atk:+atk,def:+def,spa:+spa,spd:+spd,spe:+spe,bst,viability:getViability(tier)};
});

const allTypes=[...new Set(data.flatMap(d=>d.type.split('/')))].sort();
const sel=document.getElementById('typeFilter');
allTypes.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o);});

let sortKey='tier',sortDir=1;

function toggleSort(key){
  if(sortKey===key)sortDir*=-1;
  else{sortKey=key;sortDir=(key==='name'||key==='type')?1:(key==='tier'?1:-1);}
  document.querySelectorAll('th[id]').forEach(th=>th.classList.remove('sorted'));
  const th=document.getElementById('th-'+key);
  if(th)th.classList.add('sorted');
  render();
}

function buildEvoCell(name){
  const evo=EVO[name];
  if(!evo) return '<span style="color:var(--muted);font-size:11px;">— final form —</span>';
  if(evo.note) return '<span style="color:var(--muted);font-size:11px;">'+evo.note+'</span>';
  if(!evo.chain||!evo.chain.length) return '<span style="color:var(--muted);font-size:11px;">— final form —</span>';
  const{chain,finalTier,trade}=evo;
  const bc=ftClass(finalTier,trade);
  const bl=ftLabel(finalTier,trade);
  let html='<div class="evo-cell">';
  chain.forEach((step,i)=>{
    const indent=i>0?'margin-left:'+(i*10)+'px;':'';
    html+='<div class="evo-line" style="'+indent+'">';
    html+='<span class="evo-arrow">→</span>';
    html+='<span class="evo-name">'+step.n+'</span>';
    html+='<span class="evo-how">('+step.h+')</span>';
    if(i===chain.length-1)html+='<span class="evo-badge '+bc+'">'+bl+'</span>';
    html+='</div>';
  });
  html+='</div>';
  return html;
}

function statBar(val,max){
  const pct=Math.round(val/max*100);
  const col=pct>65?'#39d353':pct>35?'#f0b429':'#e05252';
  return '<div class="stat-bar"><div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%;background:'+col+'"></div></div><span class="bar-val">'+val+'</span></div>';
}

function tierClass(t){return 't-'+t.toLowerCase().replace(/[^a-z]/g,'');}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const vf=document.getElementById('viabilityFilter').value;
  const tf=document.getElementById('tierFilter').value;
  const tyf=document.getElementById('typeFilter').value;
  let rows=data.filter(d=>{
    if(q&&!d.name.toLowerCase().includes(q))return false;
    if(vf&&d.viability!==vf)return false;
    if(tf&&d.tier!==tf)return false;
    if(tyf&&!d.type.split('/').includes(tyf))return false;
    return true;
  });
  rows.sort((a,b)=>{
    let av=a[sortKey],bv=b[sortKey];
    if(sortKey==='tier'){av=TIER_ORDER.indexOf(a.tier);bv=TIER_ORDER.indexOf(b.tier);}
    if(typeof av==='string')return av.localeCompare(bv)*sortDir;
    return(av-bv)*sortDir;
  });
  document.getElementById('summary').textContent='SHOWING '+rows.length+' / '+data.length+' POKÉMON';
  const maxStats={hp:255,atk:134,def:230,spa:154,spd:230,spe:140};
  const tbody=document.getElementById('tbody');
  if(!rows.length){tbody.innerHTML='<tr><td colspan="13" class="no-results">NO POKÉMON FOUND</td></tr>';return;}
  tbody.innerHTML=rows.map(d=>{
    const types=d.type.split('/');
    const typeBadges=types.map(t=>{
      const bg=TYPE_COLORS[t]||'#888';
      return '<span class="type-badge" style="background:'+bg+'22;color:'+bg+';border:1px solid '+bg+'44">'+t+'</span>';
    }).join('');
    return '<tr class="'+RCLS[d.viability]+'">'
      +'<td><span class="vdot '+DCLS[d.viability]+'"></span></td>'
      +'<td><div class="name-cell">'+d.name+'</div></td>'
      +'<td>'+typeBadges+'</td>'
      +'<td><span class="tier-badge '+tierClass(d.tier)+'">'+d.tier+'</span></td>'
      +'<td>'+buildEvoCell(d.name)+'</td>'
      +'<td>'+statBar(d.hp,maxStats.hp)+'</td>'
      +'<td>'+statBar(d.atk,maxStats.atk)+'</td>'
      +'<td>'+statBar(d.def,maxStats.def)+'</td>'
      +'<td>'+statBar(d.spa,maxStats.spa)+'</td>'
      +'<td>'+statBar(d.spd,maxStats.spd)+'</td>'
      +'<td>'+statBar(d.spe,maxStats.spe)+'</td>'
      +'<td>'+statBar(d.bst,680)+'</td>'
      +'<td><span class="verdict '+VCSS[d.viability]+'">'+VLABEL[d.viability]+'</span></td>'
      +'</tr>';
  }).join('');
}
render();
</script>
</body>
</html>
